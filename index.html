<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stadionheft</title>
<meta name="theme-color" content="#070B12">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stadionheft">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root {
  /* Layout: eine Handy-Spalte (max. 560px), Karten pro Spiel, schwebende Glas-Tableiste unten */
  --bg: #070B12;
  --panel: #0C121D;
  --surface: rgba(255, 255, 255, 0.055);
  --line: rgba(255, 255, 255, 0.10);
  --text: #F1F5FA;
  --muted: rgba(226, 234, 245, 0.60);
  --accent: #2EF29A;
  --accent-deep: #10B981;
  --live: #FF3B5C;
  --gold: #FFC94D;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 22px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background:
    radial-gradient(700px 520px at 0% 0%, rgba(46, 242, 154, 0.16), transparent 70%),
    radial-gradient(700px 600px at 100% 100%, rgba(59, 91, 255, 0.14), transparent 70%),
    var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body.locked { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 12px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }

#view {
  max-width: 560px;
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 110px);
  display: grid;
  gap: 22px;
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top h1 { font-family: var(--font-display); font-weight: 800; font-size: 40px; letter-spacing: 0.2px; line-height: 1; }
.pill {
  font-size: 12px; font-weight: 800; padding: 6px 11px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); white-space: nowrap;
}
.demo {
  display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--muted);
  padding: 12px 14px; border-radius: 16px; border: 1px dashed rgba(255, 201, 77, 0.45); background: rgba(255, 201, 77, 0.06);
}
.demo b { color: var(--gold); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.card.hl { border-color: rgba(46, 242, 154, 0.65); box-shadow: 0 0 0 1px rgba(46, 242, 154, 0.15) inset; }
.section { display: grid; gap: 12px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px; }
.section-head h2 { font-family: var(--font-display); font-size: 24px; font-weight: 700; }
.section-head span { color: var(--muted); font-weight: 700; font-size: 14px; }
.muted { color: var(--muted); }
.press { transition: transform .15s ease, opacity .15s ease; }
.press:active { transform: scale(0.97); opacity: .9; }

/* Spieltag-Auswahl */
.md-head { display: flex; align-items: center; justify-content: space-between; }
.md-title { font-family: var(--font-display); font-weight: 800; font-size: 26px; }
.round {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface); border: 1px solid var(--line);
}
.round:disabled { opacity: .35; cursor: default; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px; margin: -10px -16px 0; scrollbar-width: none; scroll-behavior: smooth; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; color: rgba(255, 255, 255, .8);
  background: var(--surface); border: 1px solid var(--line);
}
.chip.on { color: #04140C; background: linear-gradient(135deg, var(--accent), var(--accent-deep)); border-color: transparent; box-shadow: 0 6px 18px rgba(46, 242, 154, .35); }

/* Spielkarten */
.day { display: grid; gap: 10px; }
.day-title { font-weight: 800; font-size: 14px; color: var(--muted); padding: 0 6px; }
.match {
  position: relative; width: 100%; display: grid; grid-template-columns: 1fr 104px 1fr; align-items: center;
  padding: 16px 10px; text-align: center;
}
.team { display: grid; justify-items: center; gap: 8px; min-width: 0; }
.team-name { font-weight: 700; font-size: 14.5px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mid { display: grid; justify-items: center; gap: 6px; }
.score { font-family: var(--font-display); font-weight: 800; font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
.time { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.status { font-size: 11px; font-weight: 700; color: var(--muted); }
.live {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; color: #fff;
  background: var(--live); padding: 3px 8px; border-radius: 999px;
}
.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.mark { position: absolute; top: 10px; right: 12px; width: 16px; height: 16px; }
.mark.att { color: var(--accent); }
.mark.plan { color: var(--gold); }

/* Logos */
.logo { position: relative; width: var(--s); height: var(--s); display: inline-grid; place-items: center; flex: none; }
.logo .ini {
  width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, .28), transparent 60%), var(--c);
  color: #fff; font-weight: 800; font-size: calc(var(--s) * 0.3); letter-spacing: .3px;
  text-shadow: 0 1px 2px rgba(0, 0, 0, .35); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .15);
}
.logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .35)); }
.logo.ok .ini { visibility: hidden; }

/* Tabelle */
.table { padding: 4px 0 6px; overflow: hidden; }
.row {
  display: grid; grid-template-columns: 34px 28px minmax(0, 1fr) 28px 40px 34px; gap: 8px; align-items: center;
  padding: 9px 12px; font-variant-numeric: tabular-nums;
}
.row + .row { border-top: 1px solid var(--line); }
.row.head { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.row.fav { background: rgba(46, 242, 154, .09); }
.pos { display: flex; align-items: center; gap: 6px; justify-content: flex-end; font-weight: 800; }
.zone { width: 4px; height: 22px; border-radius: 4px; background: var(--z, transparent); }
.row .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .num { text-align: right; color: var(--muted); }
.row .pts { text-align: right; font-family: var(--font-display); font-weight: 800; font-size: 19px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 0 6px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 5px; border-radius: 4px; background: var(--z); }
.credit { font-size: 11.5px; color: rgba(226, 234, 245, .4); text-align: center; }

/* Karte */
.map-card { padding: 14px; position: relative; overflow: hidden; }
.map-card > svg { display: block; width: 100%; height: auto; }
.lmap { height: 440px; border-radius: 16px; overflow: hidden; background: #0B0F17; position: relative; }
.map-tools { position: absolute; left: 24px; top: 24px; z-index: 2; display: flex; gap: 6px; }
.map-tools button { font-size: 12.5px; font-weight: 800; padding: 7px 12px; border-radius: 999px; background: rgba(12, 18, 29, .82);
  border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.map-tools button.on { background: var(--accent); color: #04140C; border-color: transparent; }
.lmap .maplibregl-ctrl-group { border-radius: 14px; overflow: hidden; }
.lmap .maplibregl-ctrl-attrib { font-size: 10px; }
.mpin { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(0, 0, 0, .8);
  border: 1.5px solid rgba(255, 255, 255, .5); box-shadow: 0 4px 12px rgba(0, 0, 0, .5); cursor: pointer; }
.mpin.v { border: 3px solid var(--accent); box-shadow: 0 0 16px rgba(46, 242, 154, .7); }
.de { fill: rgba(255, 255, 255, .035); stroke: rgba(255, 255, 255, .22); stroke-width: 1; stroke-linejoin: round; }
.pin { cursor: pointer; }
.pin circle.dot { stroke: rgba(255, 255, 255, .55); stroke-width: 1.2; }
.pin text { font-family: var(--font-body); font-weight: 800; font-size: 6px; fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.pin.v circle.dot { stroke: var(--accent); stroke-width: 2.4; }
.pin.v circle.glow { fill: rgba(46, 242, 154, .35); }
.progress { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
.ring { width: 48px; height: 48px; flex: none; }
.ring .bg { stroke: rgba(255, 255, 255, .12); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
.progress b { font-family: var(--font-display); font-size: 22px; font-weight: 800; display: block; line-height: 1.1; }
.list { display: grid; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; text-align: left; }
.item + .item { border-top: 1px solid var(--line); }
.item .grow { flex: 1; min-width: 0; }
.item .t { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .s { font-size: 12.5px; color: var(--muted); }
.tag { font-size: 11.5px; font-weight: 800; padding: 4px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); white-space: nowrap; }
.tag.ok { color: #04140C; background: var(--accent); border-color: transparent; }
.btn-ghost { font-size: 13px; font-weight: 800; padding: 8px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }

/* Mein Heft */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { padding: 16px; display: grid; gap: 4px; }
.stat svg { color: var(--accent); }
.stat b { font-family: var(--font-display); font-size: 38px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; }
.field label { font-weight: 800; }
select {
  font: inherit; font-weight: 700; color: var(--text); background: rgba(0, 0, 0, .3); border: 1px solid var(--line);
  border-radius: 12px; padding: 8px 10px; max-width: 60%;
}
.fav-card { padding: 16px; display: grid; gap: 14px; }
.fav-top { display: flex; align-items: center; gap: 12px; }
.wdl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.wdl div { background: rgba(0, 0, 0, .25); border-radius: 14px; padding: 10px; text-align: center; }
.wdl b { font-family: var(--font-display); font-size: 28px; font-weight: 800; display: block; line-height: 1.1; }
.wdl span { font-size: 11.5px; color: var(--muted); font-weight: 700; }
.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.badge { padding: 14px 6px; display: grid; justify-items: center; gap: 6px; text-align: center; }
.medal { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; position: relative; background: rgba(255, 255, 255, .06); color: rgba(255, 255, 255, .35); }
.badge.won .medal { background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color: #04140C; box-shadow: 0 8px 22px rgba(46, 242, 154, .35); }
.medal .arc { position: absolute; inset: 0; }
.badge b { font-size: 12.5px; }
.badge small { font-size: 11px; color: var(--muted); line-height: 1.3; }
.visit { display: flex; gap: 14px; padding: 14px; width: 100%; text-align: left; }
.date { width: 50px; display: grid; justify-items: center; align-content: center; }
.date b { font-family: var(--font-display); font-size: 28px; font-weight: 800; line-height: 1; }
.date span { font-size: 11.5px; font-weight: 800; color: var(--accent); text-transform: uppercase; }
.date small { font-size: 11px; color: var(--muted); }
.vsep { width: 1px; background: var(--line); }
.lines { flex: 1; display: grid; gap: 7px; min-width: 0; }
.line { display: flex; align-items: center; gap: 8px; }
.line .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.line .g { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: rgba(255, 255, 255, .7); }
.line.w .n { font-weight: 800; }
.line.w .g { color: #fff; font-weight: 800; }
.where { font-size: 12.5px; color: var(--muted); display: flex; gap: 5px; align-items: center; }
.confirm { display: grid; gap: 10px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.empty { padding: 28px 20px; text-align: center; display: grid; gap: 8px; justify-items: center; }
.empty h3 { font-size: 18px; }
.empty p { margin: 0; color: var(--muted); max-width: 34ch; }

/* Konto & Liga */
.auth { padding: 20px 18px; display: grid; gap: 14px; }
.auth h2 { font-family: var(--font-display); font-size: 28px; font-weight: 800; line-height: 1.05; }
.auth p { margin: 0; color: var(--muted); }
.form { display: grid; gap: 10px; }
.form label { font-size: 12.5px; font-weight: 800; color: var(--muted); }
.input {
  width: 100%; font: inherit; font-weight: 600; color: var(--text); padding: 13px 14px; border-radius: 14px;
  background: rgba(0, 0, 0, .3); border: 1px solid var(--line);
}
.input::placeholder { color: rgba(226, 234, 245, .35); }
.inline { display: flex; gap: 8px; }
.inline .input { flex: 1; min-width: 0; }
.inline .primary, .inline .secondary { width: auto; padding: 12px 16px; font-size: 14.5px; white-space: nowrap; }
.msg { font-size: 13px; font-weight: 700; padding: 10px 12px; border-radius: 12px; }
.msg.err { color: #FFD1D9; background: rgba(255, 59, 92, .14); border: 1px solid rgba(255, 59, 92, .35); }
.msg.ok { color: #C9FBE3; background: rgba(46, 242, 154, .12); border: 1px solid rgba(46, 242, 154, .35); }
.hint { font-size: 12px; color: var(--muted); }
.cloud { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.cloud .grow { flex: 1; min-width: 0; font-size: 13.5px; }
.cloud b { display: block; font-size: 14.5px; }
.lg-head { padding: 16px; display: grid; gap: 12px; }
.lg-head h2 { font-family: var(--font-display); font-size: 30px; font-weight: 800; line-height: 1; }
.code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 800; letter-spacing: 2px; font-size: 16px;
  padding: 8px 12px; border-radius: 12px; background: rgba(0, 0, 0, .3); border: 1px dashed rgba(46, 242, 154, .5); color: var(--accent); }
.lrow { display: grid; grid-template-columns: 30px minmax(0, 1fr) 28px 34px 38px 40px; gap: 8px; align-items: center; padding: 10px 12px; font-variant-numeric: tabular-nums; }
.lrow + .lrow { border-top: 1px solid var(--line); }
.lrow.head { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.lrow.me { background: rgba(46, 242, 154, .09); }
.lrow .who { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 800; }
.lrow .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .rk { font-weight: 800; text-align: right; }
.lrow .num { text-align: right; color: var(--muted); }
.lrow .pts { text-align: right; font-family: var(--font-display); font-weight: 800; font-size: 20px; }
.feed { display: grid; }
.feed-item { display: flex; gap: 10px; align-items: center; padding: 12px 14px; }
.feed-item + .feed-item { border-top: 1px solid var(--line); }
.feed-item .grow { flex: 1; min-width: 0; }
.feed-item .t { font-weight: 700; font-size: 14px; }
.feed-item .s { font-size: 12.5px; color: var(--muted); }
.avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #04140C;
  background: linear-gradient(135deg, var(--accent), var(--accent-deep)); }
.lchips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.lchips::-webkit-scrollbar { display: none; }
.lchip { padding: 9px 14px; border-radius: 999px; font-weight: 800; font-size: 13.5px; white-space: nowrap; background: var(--surface); border: 1px solid var(--line); }
.lchip.on { background: var(--accent); color: #04140C; border-color: transparent; }
.link-btn { font-weight: 800; font-size: 13.5px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; justify-self: center; padding: 6px; }

/* Verein */
.comp { display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 800; letter-spacing: .4px; padding: 2px 7px; border-radius: 6px;
  color: var(--cc); background: color-mix(in srgb, var(--cc) 16%, transparent); border: 1px solid color-mix(in srgb, var(--cc) 40%, transparent); }
.clubs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.club-btn { display: grid; justify-items: center; gap: 6px; padding: 12px 4px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: 12.5px; }
.club-btn.on { border-color: var(--accent); background: rgba(46, 242, 154, .1); }
.club-hero { padding: 18px 16px; display: grid; gap: 16px; }
.club-hero .two .secondary, .club-hero .two .primary { padding: 13px 8px; font-size: 14.5px; white-space: nowrap; }
.club-hero h2 { font-family: var(--font-display); font-size: 28px; font-weight: 800; line-height: 1.05; }
.hero-facts { display: flex; gap: 10px; }
.hero-facts div { flex: 1; background: rgba(0, 0, 0, .25); border-radius: 14px; padding: 10px 12px; }
.hero-facts b { font-family: var(--font-display); font-size: 26px; font-weight: 800; display: block; line-height: 1; }
.hero-facts span { font-size: 11.5px; color: var(--muted); font-weight: 700; }
.next { width: 100%; padding: 16px 12px; display: grid; gap: 14px; text-align: center; }
.next-when { font-weight: 800; color: var(--accent); font-size: 14px; }
.next .hero-row { grid-template-columns: 1fr 70px 1fr; }
.next .team-name { white-space: normal; }
.cm { display: flex; align-items: stretch; }
.cm-main { flex: 1; min-width: 0; display: flex; gap: 12px; align-items: center; padding: 12px 12px 12px 14px; text-align: left; }
.cm .date { width: 42px; }
.cm .date b { font-size: 24px; }
.cm-mid { flex: 1; min-width: 0; display: grid; gap: 6px; }
.cm-meta { display: flex; gap: 6px; align-items: center; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.cm-opp { display: flex; gap: 8px; align-items: center; font-weight: 800; min-width: 0; }
.cm-opp span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cm-score { font-family: var(--font-display); font-weight: 800; font-size: 22px; display: grid; justify-items: end; gap: 3px; font-variant-numeric: tabular-nums; }
.cm-score.time-s { font-size: 18px; color: var(--muted); }
.res { font-style: normal; font-family: var(--font-body); font-size: 10.5px; font-weight: 800; width: 20px; height: 20px; border-radius: 6px; display: inline-grid; place-items: center; color: #04140C; }
.res-S { background: var(--accent); }
.res-U { background: #C9D2DE; }
.res-N { background: var(--live); color: #fff; }
.form { display: inline-flex; gap: 4px; }
.tick { width: 54px; flex: none; display: grid; place-items: center; border-left: 1px solid var(--line); color: var(--muted); }
.tick.on { color: var(--accent); }
.tick.plan { color: var(--gold); }
.mark-s { align-self: center; margin-right: 12px; }
.mark-s.att { color: var(--accent); }
.mark-s.plan { color: var(--gold); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.seg button { padding: 9px; border-radius: 10px; font-weight: 800; font-size: 14px; color: var(--muted); }
.seg button.on { background: rgba(255, 255, 255, .1); color: var(--text); }
select.input { appearance: auto; }
.top select { max-width: none; }

/* Buttons */
.primary {
  --check: var(--accent);
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px; border-radius: 18px;
  font-weight: 800; font-size: 16px; color: #04140C; background: linear-gradient(135deg, var(--accent), var(--accent-deep));
  box-shadow: 0 10px 28px rgba(46, 242, 154, .30);
}
.secondary {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px; border-radius: 18px;
  font-weight: 800; font-size: 16px; background: var(--surface); border: 1px solid var(--line);
}

/* Tableiste */
.tabbar {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 12px); transform: translateX(-50%);
  width: min(528px, calc(100% - 24px)); display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 6px;
  border-radius: 28px; background: rgba(18, 24, 36, .72); border: 1px solid var(--line);
  backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4);
  box-shadow: 0 12px 40px rgba(0, 0, 0, .45); z-index: 10;
}
.tab { display: grid; justify-items: center; gap: 3px; padding: 8px 2px; border-radius: 22px; font-size: 11px; white-space: nowrap; font-weight: 700; color: rgba(255, 255, 255, .7); }
.tab.on { color: var(--accent); background: rgba(255, 255, 255, .07); }

/* Sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; display: grid; align-items: end; justify-items: center; }
.sheet-wrap[hidden] { display: none; }
.backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: fade .2s ease; }
.panel {
  position: relative; width: min(560px, 100%); max-height: 92%; overflow-y: auto; overscroll-behavior: contain;
  background: linear-gradient(180deg, color-mix(in srgb, var(--tint, #2EF29A) 14%, var(--panel)), var(--panel) 320px);
  border: 1px solid var(--line); border-bottom: 0; border-radius: 28px 28px 0 0;
  padding: 10px 16px calc(env(safe-area-inset-bottom) + 24px); display: grid; gap: 18px; animation: up .28s cubic-bezier(.2, .8, .2, 1);
}
.grab { width: 40px; height: 5px; border-radius: 9px; background: rgba(255, 255, 255, .25); justify-self: center; }
.close { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
.hero { border-radius: 26px; padding: 20px 14px; display: grid; gap: 16px; border: 1px solid var(--line); }
.hero-row { display: grid; grid-template-columns: 1fr 120px 1fr; align-items: start; }
.hero .team-name { white-space: normal; font-size: 14px; line-height: 1.25; }
.role { font-size: 10.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
.hero .score { font-size: 60px; }
.hero .time { font-size: 44px; }
.meta { display: grid; gap: 6px; justify-items: center; font-size: 13px; color: var(--muted); font-weight: 600; text-align: center; }
.meta span { display: inline-flex; gap: 6px; align-items: center; }
.banner { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
.banner .grow { flex: 1; }
.banner b { display: block; font-size: 16px; }
.banner small { color: var(--muted); }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); color: var(--live); }
textarea {
  width: 100%; min-height: 96px; resize: vertical; font: inherit; color: var(--text); padding: 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
}
textarea::placeholder { color: rgba(226, 234, 245, .4); }
.goals { padding: 0 14px; }
.goal { display: flex; align-items: center; gap: 10px; padding: 12px 0; }
.goal + .goal { border-top: 1px solid var(--line); }
.goal.away { flex-direction: row-reverse; text-align: right; }
.minute { flex: none; min-width: 40px; text-align: center; font-weight: 800; font-size: 12.5px; color: #04140C; background: linear-gradient(135deg, var(--accent), var(--accent-deep)); border-radius: 999px; padding: 3px 6px; font-variant-numeric: tabular-nums; }
.goal .who { flex: 1; min-width: 0; font-weight: 700; }
.goal .who small { display: block; font-size: 11px; font-weight: 800; }
.goal .sc { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--muted); }
.info { padding: 0 14px; }
.info div { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; }
.info div + div { border-top: 1px solid var(--line); }
.info dt, .info dd { margin: 0; }
.info dt { color: var(--muted); }
.info dd { font-weight: 700; text-align: right; }
.routes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.routes a { text-decoration: none; }
.loading { display: grid; place-items: center; padding: 70px 0; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .15); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
@media (max-width: 380px) {
  .match { grid-template-columns: 1fr 88px 1fr; }
  .score { font-size: 32px; }
  .badges { grid-template-columns: repeat(2, 1fr); }
}
</style>

/* Wikimedia-SVG-Logos → PNG-Vorschaubild */
function pngURL(raw) {
  if (!raw) return null;
  const isSvg = /\.svg$/i.test(raw) && raw.includes('upload.wikimedia.org/wikipedia/') && !raw.includes('/thumb/');
  if (!isSvg) return raw;
  const parts = raw.split('/');
  const w = parts.indexOf('wikipedia');
  if (w < 0 || parts.length <= w + 2) return raw;
  const file = parts[parts.length - 1];
  parts.splice(w + 2, 0, 'thumb');
  return `${parts.join('/')}/500px-${file}.png`;
}
function initials(name) {
  const words = String(name).split(' ').filter((w) => /^\p{L}/u.test(w));
  return (words.length >= 2 ? words.slice(0, 2).map((w) => w[0]).join('') : String(name).slice(0, 3)).toUpperCase();
}
function logo(teamId, name, icon, size) {
  const url = pngURL(icon || ICONS[teamId]);
  return `<span class="logo" style="--s:${size}px;--c:${clubColor(teamId)}"><span class="ini">${esc(CLUBS[teamId]?.k || initials(name))}</span>${
    url ? `<img src="${esc(url)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ''}</span>`;
}

/* ================= Spiel-Logik ================= */
function kickoff(m) {
  if (m.matchDateTimeUTC) return new Date(m.matchDateTimeUTC.endsWith('Z') ? m.matchDateTimeUTC : m.matchDateTimeUTC + 'Z');
  if (m.matchDateTime) return new Date(m.matchDateTime);
  return null;
}
function matchState(m) {
  if (m.matchIsFinished) return 'finished';
  const k = kickoff(m);
  if (!k) return 'upcoming';
  const now = Date.now();
  if (now < k.getTime()) return 'upcoming';
  if (now < k.getTime() + 2.5 * 3600e3) return 'live';
  return 'finished';
}
function result(m, type) {
  const r = (m.matchResults || []).find((x) => x.resultTypeID === type);
  return r && r.pointsTeam1 != null && r.pointsTeam2 != null ? [r.pointsTeam1, r.pointsTeam2] : null;
}
function sortedGoals(m) {
  return [...(m.goals || [])].sort((a, b) => {
    const l = (a.scoreTeam1 || 0) + (a.scoreTeam2 || 0);
    const r = (b.scoreTeam1 || 0) + (b.scoreTeam2 || 0);
    return l === r ? (a.matchMinute || 0) - (b.matchMinute || 0) : l - r;
  });
}
function currentScore(m) {
  const fin = result(m, 2);
  if (fin) return fin;
  if (matchState(m) === 'upcoming') return null;
  const last = sortedGoals(m).pop();
  return last ? [last.scoreTeam1 || 0, last.scoreTeam2 || 0] : [0, 0];
}
function stadiumOf(m) {
  const c = CLUBS[m.team1.teamId];
  return {
    name: c?.s ?? m.location?.locationStadium ?? `Stadion von ${m.team1.teamName || 'Heimteam'}`,
    city: c?.city ?? m.location?.locationCity ?? '',
  };
}
const teamName = (t) => clubName(t.teamId, t.shortName || t.teamName);
const fullName = (t) => CLUBS[t.teamId]?.f ?? t.teamName;

function statusHTML(m) {
  const st = matchState(m);
  if (st === 'live') return '<span class="live">LIVE</span>';
  return `<span class="status">${st === 'finished' ? 'Endstand' : 'Anstoß'}</span>`;
}

/* ================= Stadionheft (Besuche) ================= */
function visitFromMatch(m, attended) {
  const st = stadiumOf(m);
  const fin = m.matchIsFinished ? result(m, 2) : null;
  return {
    matchID: m.matchID, kickoff: (kickoff(m) || new Date()).toISOString(), season: m.leagueSeason ?? SEASON,
    matchday: m.group?.groupOrderID ?? 0, comp: compOf(m),
    homeId: m.team1.teamId, homeName: teamName(m.team1), homeIcon: m.team1.teamIconUrl || null,
    awayId: m.team2.teamId, awayName: teamName(m.team2), awayIcon: m.team2.teamIconUrl || null,
    hg: fin ? fin[0] : null, ag: fin ? fin[1] : null, stadium: st.name, city: st.city,
    attended, note: '', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
  };
}
function updateVisit(v, m) {
  const k = kickoff(m);
  if (k) v.kickoff = k.toISOString();
  if (m.matchIsFinished) { const fin = result(m, 2); if (fin) { v.hg = fin[0]; v.ag = fin[1]; } }
}
const allVisits = () => Object.values(store.visits).sort((a, b) => new Date(b.kickoff) - new Date(a.kickoff));
const isPast = (v) => new Date(v.kickoff).getTime() < Date.now();
const hasScore = (v) => v.hg != null && v.ag != null;

function bookStats(visits, fav) {
  const s = { games: visits.length, scored: 0, goals: 0, stadiums: new Set(visits.map((v) => v.stadium)).size,
    complete: new Set(visits.map((v) => v.homeId).filter((id) => CURRENT_IDS.includes(id))).size,
    big: 0, nil: 0, favGames: 0, favAway: 0, w: 0, d: 0, l: 0 };
  for (const v of visits) {
    const home = fav && v.homeId === fav;
    const away = fav && v.awayId === fav;
    if (home || away) s.favGames++;
    if (away) s.favAway++;
    if (!hasScore(v)) continue;
    const total = v.hg + v.ag;
    s.scored++; s.goals += total;
    if (total >= 6) s.big++;
    if (total === 0) s.nil++;
    if (!home && !away) continue;
    const own = home ? v.hg : v.ag;
    const other = home ? v.ag : v.hg;
    if (own > other) s.w++; else if (own === other) s.d++; else s.l++;
  }
  s.avg = s.scored ? s.goals / s.scored : 0;
  return s;
}

  return [
    { t: 'Anpfiff', d: 'Erstes Spiel im Stadion', i: 'ball', p: s.games, g: 1 },

    { t: 'Torfestival', d: 'Ein Spiel mit 6+ Toren', i: 'flame', p: s.big, g: 1 },

}

async function api(path) {
  const res = await fetch(`${API}/${path}`, { headers: { Accept: 'application/json' }, cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}
const data = {
  matches: (season, md) => (S.demo ? Promise.resolve(season === SNAP.season ? (SNAP.matches[md] || []) : []) : api(`getmatchdata/${LEAGUE}/${season}/${md}`)),
  match: (id) => (S.demo ? Promise.resolve(SNAP.byId[id] || null) : api(`getmatchdata/${id}`)),
  table: (season) => (S.demo ? Promise.resolve(season === SNAP.season ? SNAP.table : []) : api(`getbltable/${LEAGUE}/${season}`)),
  teams: () => (S.demo ? Promise.resolve(CURRENT_IDS.map((id) => ({ teamId: id, teamName: CLUBS[id].f, teamIconUrl: ICONS[id] }))) : api(`getavailableteams/${LEAGUE}/${SEASON}`)),
};

async function start() {
  S.loading = true; S.error = null; S.ready = false; render();
  try {
    const g = await api(`getcurrentgroup/${LEAGUE}`);
    S.demo = false;
    S.matchday = Math.min(34, Math.max(1, g.groupOrderID || 1));
    S.currentMd = S.matchday;
  } catch (e) {
    if (navigator.onLine === false) { S.loading = false; S.error = 'Du bist offline. Verbinde dich mit dem Internet und versuch es nochmal.'; render(); return; }
    S.demo = true;              // z. B. in der Vorschau, wo keine externen Abfragen erlaubt sind
    S.matchday = SNAP.current;
    S.currentMd = SNAP.current;
  }
  S.ready = true;
  if (cloudConfigured()) initCloud();
  if (S.view !== 'spiele') render();
  await loadMatchday(S.matchday);
  data.teams().then((t) => { S.teams = t; if (S.view === 'stadien') render(); }).catch(() => {});
  refreshOpenResults();
}

const ck = (season, md) => `${season}-${md}`;
async function loadMatchday(md, quiet = false) {
  const season = S.bSeason;
  const key = ck(season, md);
  if (!S.cache[key] && !quiet) { S.loading = true; if (S.view === 'spiele') render(); }
  try {
    S.cache[key] = await data.matches(season, md);
    S.error = null;
  } catch (e) {
    if (!S.cache[key]) S.error = 'Die Spiele konnten nicht geladen werden. Prüfe deine Internetverbindung.';
  }
  S.loading = false;
  if (S.matchday === md && S.bSeason === season && S.view === 'spiele') render();
}
function setSeason(season) {
  if (season === S.bSeason) return;
  S.bSeason = season;
  S.matchday = season === SEASON ? (S.currentMd || 1) : 1;
  S.chipScroll = 0;
  render();
  loadMatchday(S.matchday);
  if (S.spieleMode === 'tabelle') loadTable(season);
}

function setMatchday(md) {
  md = Math.min(34, Math.max(1, md));
  if (md === S.matchday) return;
  const chips = $('#chips');
  if (chips) S.chipScroll = chips.scrollLeft;
  S.matchday = md;
  render();
  loadMatchday(md);
}

async function loadTable(season) {
  if (S.tableLoading[season]) return;
  S.tableLoading[season] = true;
  try { S.tables[season] = await data.table(season); delete S.tableErrors[season]; }
  catch (e) { S.tableErrors[season] = 'Die Tabelle konnte nicht geladen werden.'; }
  S.tableLoading[season] = false;
  if (S.view === 'spiele' || S.view === 'verein') render();
}

async function refreshOpenResults() {
  if (S.demo) return;
  const open = allVisits().filter((v) => !hasScore(v) && new Date(v.kickoff).getTime() + 2 * 3600e3 < Date.now()).slice(0, 20);
  let changed = false;
  for (const v of open) {
    try {
      const m = await data.match(v.matchID);
      if (m) { updateVisit(v, m); if (hasScore(v)) { persistVisit(v); changed = true; } }
    } catch (e) { /* später nochmal */ }
  }
  if (changed && S.view === 'heft') render();
}

/* Live-Spiele jede Minute aktualisieren */
setInterval(async () => {
  if (S.demo || document.hidden) return;
  const list = S.bSeason === SEASON ? (S.cache[ck(SEASON, S.matchday)] || []) : [];
  if (list.some((m) => matchState(m) === 'live')) await loadMatchday(S.matchday, true);
  if (S.sheet?.type === 'match' && matchState(S.sheet.match) === 'live') {
    try { const fresh = await data.match(S.sheet.match.matchID); if (fresh) { S.sheet.match = fresh; renderSheet(); } } catch (e) { /* egal */ }
  }

function project(lat, lon) { return [(lon - GEO.lonMin) * GEO.c * GEO.k, (GEO.latMax - lat) * GEO.k]; }
function distanceKm(a, b) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function viewStadien() {
  const ids = stadiumClubs();
  const attended = allVisits().filter((v) => v.attended);
  const visited = new Set(attended.map((v) => v.homeId));
  const count = ids.filter((id) => visited.has(id)).length;
  const frac = ids.length ? count / ids.length : 0;
  const C = 2 * Math.PI * 20;
  const pins = ids.map((id) => {
    const c = CLUBS[id];
    const [x, y] = project(c.lat, c.lon);
    const v = visited.has(id);
    return `<g class="pin${v ? ' v' : ''}" data-act="stadium" data-id="${id}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})" role="button" aria-label="${esc(c.s)}">

  if (S.nearby) order.sort((a, b) => distanceKm(S.nearby, CLUBS[a]) - distanceKm(S.nearby, CLUBS[b]));

  const items = order.map((id) => {

      : `<div class="card map-card"><svg viewBox="-12 -12 ${GEO.W + 24} ${Math.round(GEO.H) + 24}" role="img" aria-label="Karte der Bundesliga-Stadien">

      <div class="fav-top">${logo(store.fav, fav.n, favIcon, 44)}<div><b style="font-size:16px">${esc(fav.f)}</b><div class="muted" style="font-size:13px">${s.favGames} Spiele live · ${s.favAway} auswärts</div></div></div>

    const done = b.p >= b.g;

    const arc = done || !frac ? '' : `<svg class="arc" viewBox="0 0 56 56"><circle cx="28" cy="28" r="26" fill="none" stroke="var(--accent)" stroke-opacity=".75" stroke-width="3" stroke-linecap="round" stroke-dasharray="${(C * frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 28 28)"/></svg>`;

async function openMatch(id) {
  if (id < 0) { const v = store.visits[id]; if (v) { S.sheet = { type: 'match', match: matchFromVisit(v) }; renderSheet(); } return; }
  const m = Object.values(S.cache).flat().find((x) => x.matchID === id)
    || Object.values(S.clubCache).flatMap((x) => x.list).find((x) => x.matchID === id) || SNAP.byId[id];
  if (m) { S.sheet = { type: 'match', match: m }; renderSheet(); }
  try {
    const fresh = await data.match(id);
    if (fresh) {
      if (m?._comp) fresh._comp = m._comp;
      S.sheet = { type: 'match', match: fresh };
      const v = store.visits[id];
      if (v) { const had = hasScore(v); updateVisit(v, fresh); if (!had && hasScore(v)) persistVisit(v); else save(); }
      renderSheet();
    }
  } catch (e) {
    if (!m) {
      const v = store.visits[id];
      if (v) { S.sheet = { type: 'match', match: matchFromVisit(v) }; renderSheet(); }
    }
  }
}
function matchFromVisit(v) {
  const results = hasScore(v) ? [{ resultTypeID: 2, pointsTeam1: v.hg, pointsTeam2: v.ag }] : [];
  return { matchID: v.matchID, matchDateTimeUTC: v.kickoff, leagueSeason: v.season, group: { groupOrderID: v.matchday },
    _comp: v.comp && COMPS[v.comp] && ['bl1', 'dfb', 'ucl', 'uel', 'uecl'].includes(v.comp) ? v.comp : undefined,
    _manual: v.matchID < 0 ? (v.comp || 'other') : undefined,
    location: { locationStadium: v.stadium, locationCity: v.city },
    team1: { teamId: v.homeId, teamName: v.homeName, shortName: v.homeName, teamIconUrl: v.homeIcon },
    team2: { teamId: v.awayId, teamName: v.awayName, shortName: v.awayName, teamIconUrl: v.awayIcon },
    matchIsFinished: hasScore(v), matchResults: results, goals: [] };
}
function closeSheet() { S.sheet = null; renderSheet(); }

/* ================= Wettbewerbe & Verein ================= */
const COMPS = {
  bl1: { name: '1. Bundesliga', short: 'BL', color: '#2EF29A' },
  dfb: { name: 'DFB-Pokal', short: 'Pokal', color: '#FFC94D' },
  ucl: { name: 'Champions League', short: 'CL', color: '#5B8CFF' },
  uel: { name: 'Europa League', short: 'EL', color: '#FF9F43' },
  uecl: { name: 'Conference League', short: 'ECL', color: '#2CC5D2' },
  test: { name: 'Testspiel', short: 'Test', color: '#9AA4B2' },
  other: { name: 'Anderer Wettbewerb', short: 'Andere', color: '#9AA4B2' },
};
/* Wo OpenLigaDB die Wettbewerbe je Saison führt (Community-Daten, teils doppelt angelegt) */
const SOURCES = {
  2026: { dfb: [['dfb', 2026]], ucl: [['ucl', 2026]], uel: [['uel2026', 2026]], uecl: [['uecl2026', 2026]] },
  2025: { dfb: [['dfb', 2025]], ucl: [['ucl', 2025], ['ucl2025', 2025]], uel: [['uel', 2025]] },
  2024: { dfb: [['dfb2024', 2024], ['dfb', 2024]], ucl: [['ucl2024', 2024], ['ucl24', 2024], ['cl24de', 2024]], uel: [['uel', 2024], ['uel24', 2024]] },
  2023: { dfb: [['dfb', 2023], ['dfb2023', 2023]], ucl: [['champion1', 2023], ['cl1', 2023]], uel: [['uel2023', 2023]], uecl: [['uefaconf2023', 2023]] },
  2022: { dfb: [['dfb2022', 2022]], ucl: [['uefacl22', 2022]], uel: [['uel2022', 2022]], uecl: [['uecl', 2022]] },
  2021: { dfb: [['dfb2021', 2021]], ucl: [['uefacl', 2021]], uel: [['el21', 2021]] },
  2020: { dfb: [['dfb2020', 2020]], ucl: [['uefacl2020', 2020], ['cl2020ger', 2020], ['uefacl', 2020]] },
  2019: { dfb: [['dfb2019', 2019]], ucl: [['cl1920german', 2019], ['ucl2020', 2020]], uel: [['euroleague19', 2020]] },
};
const HISTORY_SEASONS = [2026, 2025, 2024, 2023, 2022, 2021, 2020, 2019].filter((s) => s <= SEASON);
/* Suchbegriff je Verein für die Team-Filter der API */
const CLUB_Q = { 40: 'Bayern', 7: 'Dortmund', 6: 'Leverkusen', 1635: 'Leipzig', 91: 'Frankfurt', 16: 'Stuttgart', 112: 'Freiburg', 87: 'Borussia M',
  134: 'Bremen', 81: 'Mainz', 95: 'Augsburg', 175: 'Hoffenheim', 80: 'Union Berlin', 65: 'Köln', 100: 'Hamburger', 9: 'Schalke',
  31: 'Paderborn', 198: 'Elversberg', 131: 'Wolfsburg', 98: 'Pauli', 199: 'Heidenheim' };
const seasonLabel = (s) => `${s}/${String((s + 1) % 100).padStart(2, '0')}`;

function compOf(m) {
  if (m._comp) return m._comp;
  const sc = String(m.leagueShortcut || ''), n = String(m.leagueName || '');
  if (/pokal/i.test(n) || /^dfb/i.test(sc)) return 'dfb';
  if (/champions/i.test(n)) return 'ucl';
  if (/europa ?league|euroleague/i.test(n) || /^(uel|el)\d*$/i.test(sc)) return 'uel';
  if (/conference/i.test(n) || /uecl|conf/i.test(sc)) return 'uecl';
  return 'bl1';
}
const compChip = (c) => { const x = COMPS[c] || COMPS.other; return `<span class="comp" style="--cc:${x.color}">${x.short}</span>`; };

const dayKeyOf = (m) => { const k = kickoff(m); return k ? fmtDayKey.format(k) : 'x'; };
function dedupe(list) {
  const best = new Map();
  for (const m of list) {
    const key = `${dayKeyOf(m)}|${m.team1.teamId}|${m.team2.teamId}`;
    const cur = best.get(key);
    const score = (x) => (result(x, 2) ? 10 : 0) + (x.goals?.length || 0);
    if (!cur || score(m) > score(cur)) best.set(key, m);
  }
  return [...best.values()].sort((a, b) => (kickoff(a) || 0) - (kickoff(b) || 0));
}

async function fetchComp(comp, sources, teamId) {
  const out = [];
  const q = encodeURIComponent(CLUB_Q[teamId] || CLUBS[teamId]?.n || '');
  for (const [sc, season] of sources) {
    let list = [];
    try { list = await api(`getmatchdata/${sc}/${season}/${q}`); } catch (e) { list = []; }
    if (!Array.isArray(list)) list = [];
    list = list.filter((m) => m?.team1 && m?.team2 && (m.team1.teamId === teamId || m.team2.teamId === teamId));
    if (comp === 'bl1' && !list.length) {
      try { list = (await api(`getmatchdata/bl1/${season}`)).filter((m) => m.team1.teamId === teamId || m.team2.teamId === teamId); } catch (e) { list = []; }
    }
    // Platzhalter-Ligen (alle Spiele mit gleichem Termin) überspringen
    if (list.length >= 3 && new Set(list.map((m) => m.matchDateTimeUTC)).size === 1) continue;
    list.forEach((m) => { m._comp = comp; });
    out.push(...list);
  }
  return out;
}

function clubMatches(teamId, season) {
  const key = `${teamId}:${season}`;
  const hit = S.clubCache[key];
  const fresh = hit && (season !== SEASON || Date.now() - hit.at < 5 * 60e3);
  if (fresh || S.clubLoading[key]) return hit?.list || null;
  S.clubLoading[key] = (async () => {
    let list;
    if (S.demo) {
      list = season === SNAP.season ? Object.values(SNAP.byId).filter((m) => m.team1.teamId === teamId || m.team2.teamId === teamId) : [];
    } else {
      const jobs = [fetchComp('bl1', [['bl1', season]], teamId)];
      for (const [comp, src] of Object.entries(SOURCES[season] || {})) jobs.push(fetchComp(comp, src, teamId));
      const res = await Promise.allSettled(jobs);
      list = res.flatMap((r) => (r.status === 'fulfilled' ? r.value : []));
    }
    S.clubCache[key] = { list: dedupe(list), at: Date.now() };
    delete S.clubLoading[key];
    if (S.view === 'verein') render();
  })().catch(() => { delete S.clubLoading[key]; S.clubCache[key] = { list: [], at: Date.now(), failed: true }; if (S.view === 'verein') render(); });
  return hit?.list || null;
}

function relDay(k) {
  const today = fmtDayKey.format(new Date());
  const tomorrow = fmtDayKey.format(new Date(Date.now() + 864e5));
  const key = fmtDayKey.format(k);
  if (key === today) return `Heute, ${fmtTime.format(k)} Uhr`;
  if (key === tomorrow) return `Morgen, ${fmtTime.format(k)} Uhr`;
  const days = Math.round((new Date(key) - new Date(today)) / 864e5);
  return days > 0 && days < 7 ? `In ${days} Tagen · ${fmtWd.format(k)}, ${fmtTime.format(k)} Uhr` : `${fmtDay.format(k)}, ${fmtTime.format(k)} Uhr`;
}

function outcome(m, clubId) {
  const sc = result(m, 2);
  if (!sc) return null;
  const home = m.team1.teamId === clubId;
  const own = home ? sc[0] : sc[1], other = home ? sc[1] : sc[0];
  return own > other ? 'S' : own === other ? 'U' : 'N';
}

  const n = name.trim().toLowerCase();

  const hit = Object.entries(CLUBS).find(([, c]) => c.n.toLowerCase() === n || c.f.toLowerCase() === n || c.f.toLowerCase().includes(n) || c.k.toLowerCase() === n);
  return hit ? Number(hit[0]) : 0;
}

/* ================= Konten, Cloud-Sync & Ligen (Supabase) ================= */
let sb = null;
const cloudConfigured = () => !S.demo && !!SUPABASE_URL && !!SUPABASE_KEY;
const USERNAME_RE = /^[a-z0-9_]{3,20}$/;

function loadScript(src, integrity) {
  return new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = src; el.integrity = integrity; el.crossOrigin = 'anonymous';
    el.onload = () => resolve(); el.onerror = () => reject(new Error(`${src} nicht geladen`));
    document.head.appendChild(el);
  });
}

async function initCloud() {
  try {
    if (!window.supabase) await loadScript(SUPABASE_JS.src, SUPABASE_JS.sri);
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, storageKey: 'stadionheft-auth' },
    });
    const { data } = await sb.auth.getSession();
    sb.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT' && S.user) setTimeout(afterLogout, 0); });
    if (data.session) await afterLogin(data.session.user);
  } catch (e) {
    S.cloudError = 'Die Konto-Funktion ist gerade nicht erreichbar.';
  }
  S.cloudReady = true;
  if (S.view === 'liga' || S.view === 'heft') render();
}

const toRow = (v) => ({
  user_id: S.user.id, match_id: v.matchID, kickoff: v.kickoff, season: v.season ?? null, matchday: v.matchday ?? null,
  home_id: v.homeId, home_name: v.homeName, home_icon: v.homeIcon ?? null,
  away_id: v.awayId, away_name: v.awayName, away_icon: v.awayIcon ?? null,
  hg: v.hg ?? null, ag: v.ag ?? null, stadium: v.stadium || '', city: v.city || '',
  attended: !!v.attended, note: (v.note || '').slice(0, 2000), updated_at: v.updatedAt || new Date().toISOString(),
  comp: v.comp || 'bl1',
});
const fromRow = (r) => ({
  matchID: r.match_id, kickoff: r.kickoff, season: r.season, matchday: r.matchday,
  homeId: r.home_id, homeName: r.home_name, homeIcon: r.home_icon,
  awayId: r.away_id, awayName: r.away_name, awayIcon: r.away_icon,
  hg: r.hg, ag: r.ag, stadium: r.stadium, city: r.city, attended: r.attended, note: r.note || '', comp: r.comp || 'bl1',
  createdAt: r.updated_at, updatedAt: r.updated_at,
});

/* Lokales Heft und Konto zusammenführen: neuerer Stand gewinnt, nur lokal Vorhandenes wird hochgeladen */
async function syncVisits() {
  const { data, error } = await sb.from('visits').select('*');
  if (error) throw error;
  const upload = [];
  const merged = {};
  for (const r of data) merged[r.match_id] = fromRow(r);
  for (const v of Object.values(store.visits)) {
    const c = merged[v.matchID];
    if (!c || new Date(v.updatedAt || 0) > new Date(c.updatedAt || 0)) { merged[v.matchID] = v; upload.push(v); }
  }
  store.visits = merged;
  save();
  if (upload.length) {
    const { error: upErr } = await sb.from('visits').upsert(upload.map(toRow));
    if (upErr) throw upErr;
  }
}

function persistVisit(v) {
  v.updatedAt = new Date().toISOString();
  save();
  if (!sb || !S.user) return;
  sb.from('visits').upsert(toRow(v)).then(({ error }) => { if (error) S.syncError = true; });
}
function deleteVisit(id) {
  delete store.visits[id];
  save();
  if (!sb || !S.user) return;
  sb.from('visits').delete().eq('match_id', id).then(({ error }) => { if (error) S.syncError = true; });
}
let noteTimer = null;
function persistNoteSoon(v) {
  v.updatedAt = new Date().toISOString();
  save();
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => persistVisit(v), 800);
}
function persistFav() {
  save();
  if (sb && S.user) sb.from('profiles').update({ fav: store.fav }).eq('id', S.user.id).then(() => {});
}

async function afterLogin(user) {
  S.user = { id: user.id, username: user.user_metadata?.username || (user.email || '').split('@')[0] };
  try { await syncVisits(); S.syncError = false; } catch (e) { S.syncError = true; }
  try {
    const { data } = await sb.from('profiles').select('fav').eq('id', user.id).single();
    if (data?.fav) store.fav = data.fav;
    else if (store.fav) persistFav();
    save();
  } catch (e) { /* egal */ }
  await loadLeagues();
  if (S.pendingJoin) {
    const code = S.pendingJoin;
    S.pendingJoin = null;
    try { sessionStorage.removeItem('stadionheft.join'); } catch (e) { /* egal */ }
    await joinLeague(code);
  }
}

function afterLogout() {
  S.user = null; S.leagues = null; S.league = null; S.board = {}; S.confirmLeave = null;
  store.visits = {}; store.fav = 0; save();
  S.authMsg = { ok: true, text: 'Abgemeldet. Dein Stadionheft ist in deinem Konto gesichert.' };
  render();
}

async function authSubmit(mode, username, password) {
  const u = username.trim().toLowerCase();
  S.authMsg = null;
  if (!USERNAME_RE.test(u)) { S.authMsg = { text: 'Benutzername: 3–20 Zeichen, nur Buchstaben, Zahlen und _.' }; render(); return; }
  if (password.length < 6) { S.authMsg = { text: 'Das Passwort braucht mindestens 6 Zeichen.' }; render(); return; }
  S.authBusy = true; render();
  const email = `${u}@${AUTH_DOMAIN}`;
  try {
    let res;
    if (mode === 'signup') {
      res = await sb.auth.signUp({ email, password, options: { data: { username: u } } });
      if (!res.error && !res.data.session) {
        S.authMsg = { text: 'Konto angelegt, aber Supabase verlangt noch eine E-Mail-Bestätigung. Schalte in Supabase unter Authentication → Sign In / Providers → Email die Option „Confirm email“ aus.' };
      }
    } else {
      res = await sb.auth.signInWithPassword({ email, password });
    }
    if (res.error) {
      const m = (res.error.message || '').toLowerCase();
      S.authMsg = { text: m.includes('already') ? 'Dieser Benutzername ist schon vergeben.'
        : m.includes('invalid login') ? 'Benutzername oder Passwort ist falsch.'
        : m.includes('password') ? 'Das Passwort ist zu schwach. Nimm mindestens 6 Zeichen.'
        : 'Das hat nicht geklappt. Versuch es gleich nochmal.' };
    } else if (res.data.session) {
      await afterLogin(res.data.user);
    }
  } catch (e) {
    S.authMsg = { text: 'Keine Verbindung zum Server. Prüfe dein Internet.' };
  }
  S.authBusy = false;
  render();
}

async function loadLeagues() {
  if (!sb || !S.user) return;
  const { data, error } = await sb.from('league_members').select('league_id, leagues(id, name, invite_code, owner_id)').eq('user_id', S.user.id);
  if (error) { S.ligaMsg = { text: 'Ligen konnten nicht geladen werden.' }; return; }
  S.leagues = data.map((r) => r.leagues).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name, 'de'));
  if (!S.leagues.some((l) => l.id === S.league)) S.league = S.leagues[0]?.id ?? null;
  if (S.league) await loadBoard(S.league);
}

async function loadBoard(id) {
  const { data, error } = await sb.rpc('league_visits', { p_league: id });
  if (error) { S.ligaMsg = { text: 'Die Liga-Tabelle konnte nicht geladen werden.' }; return; }
  const members = new Map();
  for (const r of data) {
    if (!members.has(r.user_id)) members.set(r.user_id, { id: r.user_id, username: r.username, fav: r.fav || 0, visits: [] });
    if (r.match_id != null) {
      members.get(r.user_id).visits.push({ matchID: r.match_id, kickoff: r.kickoff, homeId: r.home_id, homeName: r.home_name, homeIcon: r.home_icon,
        awayId: r.away_id, awayName: r.away_name, awayIcon: r.away_icon, hg: r.hg, ag: r.ag, stadium: r.stadium, city: r.city, attended: true });
    }
  }
  const rows = [...members.values()].map((m) => {
    const st = bookStats(m.visits, m.fav);
    const won = badges(st).filter((b) => b.p >= b.g).length;
    return { ...m, st, won, points: st.games * 3 + st.stadiums * 5 + won };
  }).sort((a, b) => b.points - a.points || b.st.games - a.st.games || a.username.localeCompare(b.username, 'de'));
  const feed = [...members.values()]
    .flatMap((m) => m.visits.map((v) => ({ ...v, username: m.username })))
    .sort((a, b) => new Date(b.kickoff) - new Date(a.kickoff)).slice(0, 12);
  S.board[id] = { rows, feed, at: Date.now() };
}

async function createLeague(name) {
  const n = name.trim();
  if (n.length < 2) { S.ligaMsg = { text: 'Gib der Liga einen Namen mit mindestens 2 Zeichen.' }; render(); return; }
  const { data, error } = await sb.rpc('create_league', { p_name: n.slice(0, 40) });
  if (error) { S.ligaMsg = { text: 'Die Liga konnte nicht erstellt werden.' }; render(); return; }
  S.league = data.id;
  S.ligaMsg = { ok: true, text: `Liga „${data.name}“ erstellt. Lade jetzt deine Freunde ein.` };
  await loadLeagues();
  render();
}

async function joinLeague(code) {
  const c = code.trim().toUpperCase();
  if (!/^[A-Z0-9]{6,12}$/.test(c)) { S.ligaMsg = { text: 'Der Einladungscode hat 8 Zeichen, zum Beispiel A1B2C3D4.' }; render(); return; }
  const { data, error } = await sb.rpc('join_league', { p_code: c });
  if (error) { S.ligaMsg = { text: 'Diesen Einladungscode gibt es nicht.' }; render(); return; }
  S.league = data.id;
  S.ligaMsg = { ok: true, text: `Du bist jetzt in der Liga „${data.name}“.` };
  await loadLeagues();
  render();
}

async function leaveLeague(id) {
  const { error } = await sb.from('league_members').delete().eq('league_id', id).eq('user_id', S.user.id);
  S.confirmLeave = null;
  if (error) { S.ligaMsg = { text: 'Verlassen hat nicht geklappt.' }; render(); return; }
  delete S.board[id];
  S.league = null;
  S.ligaMsg = { ok: true, text: 'Liga verlassen.' };
  await loadLeagues();
  render();
}

async function shareInvite(l) {
  const url = `${location.origin}${location.pathname}?join=${l.invite_code}`;
  const text = `Komm in meine Stadionheft-Liga „${l.name}“! Code: ${l.invite_code}`;
  try {
    if (navigator.share) { await navigator.share({ title: 'Stadionheft-Liga', text, url }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  try {
    await navigator.clipboard.writeText(`${text}\n${url}`);
    S.ligaMsg = { ok: true, text: 'Einladungslink kopiert. Schick ihn deinen Freunden, z. B. per WhatsApp.' };
  } catch (e) {
    S.ligaMsg = { ok: true, text: `Schick deinen Freunden diesen Link: ${url}` };
  }
  render();
}

function msgHTML(m) { return m ? `<div class="msg ${m.ok ? 'ok' : 'err'}" role="status">${esc(m.text)}</div>` : ''; }

function viewLiga() {
  const head = `<header class="top"><h1>Liga</h1>${S.user ? `<span class="pill">@${esc(S.user.username)}</span>` : ''}</header>`;
  if (S.demo) {
    return head + `<div class="card empty">${ic('people', 30)}<h3>Freundes-Ligen</h3><p>In der Vorschau nicht verfügbar. In der gehosteten Version erstellst du hier ein Konto und vergleichst dich mit deinen Freunden.</p></div>`;
  }
  if (!cloudConfigured()) {
    return head + `<div class="card empty">${ic('people', 30)}<h3>Noch nicht eingerichtet</h3><p>Für Konten und Ligen fehlen noch die Supabase-Zugangsdaten in der index.html.</p></div>`;
  }
  if (!S.cloudReady) return head + loadingHTML;
  if (S.cloudError) return head + errorHTML(S.cloudError);

  if (!S.user) {
    return head + `<div class="card auth">
      <h2>Zusammen Stadien sammeln</h2>
      <p>Mit Konto wird dein Stadionheft gesichert, und du trittst mit Freunden in einer eigenen Liga gegeneinander an.</p>
      ${S.pendingJoin ? `<div class="msg ok">Du wurdest in eine Liga eingeladen. Melde dich an, dann trittst du automatisch bei.</div>` : ''}
      <form class="form" id="auth-form" novalidate>
        <label for="au">Benutzername</label>
        <input class="input" id="au" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="z. B. abdull" maxlength="20" required>
        <label for="ap">Passwort</label>
        <input class="input" id="ap" name="password" type="password" autocomplete="current-password" placeholder="mindestens 6 Zeichen" required>
        ${msgHTML(S.authMsg)}
        <div class="two">
          <button class="primary press" type="submit" data-mode="login"${S.authBusy ? ' disabled' : ''}>Anmelden</button>
          <button class="secondary press" type="submit" data-mode="signup"${S.authBusy ? ' disabled' : ''}>Konto erstellen</button>
        </div>
      </form>
      <div class="hint">Du brauchst keine E-Mail. Merk dir dein Passwort gut, denn ohne E-Mail kann man es nicht zurücksetzen.</div>
    </div>`;
  }

  const leagues = S.leagues || [];
  const forms = `<section class="section"><div class="section-head"><h2>${leagues.length ? 'Weitere Liga' : 'Deine erste Liga'}</h2></div>
    <div class="card auth">
      <form class="form" id="create-form"><label for="lname">Neue Liga erstellen</label>
        <div class="inline"><input class="input" id="lname" maxlength="40" placeholder="z. B. Kurve Monheim"><button class="primary press" type="submit">Erstellen</button></div></form>
      <form class="form" id="join-form"><label for="lcode">Mit Einladungscode beitreten</label>
        <div class="inline"><input class="input" id="lcode" maxlength="12" autocapitalize="characters" spellcheck="false" placeholder="A1B2C3D4"><button class="secondary press" type="submit">Beitreten</button></div></form>
    </div></section>`;
  const logout = `<button class="link-btn" data-act="logout">Abmelden</button>`;

  if (!leagues.length) return head + msgHTML(S.ligaMsg) + forms + logout;

  const l = leagues.find((x) => x.id === S.league) || leagues[0];
  const board = S.board[l.id];
  if (board && Date.now() - board.at > 60000) loadBoard(l.id).then(() => { if (S.view === 'liga') render(); });
  const chips = leagues.length > 1
    ? `<div class="lchips">${leagues.map((x) => `<button class="lchip press${x.id === l.id ? ' on' : ''}" data-act="league" data-lid="${x.id}">${esc(x.name)}</button>`).join('')}</div>` : '';

  let table = loadingHTML, feed = '';
  if (board) {
    table = `<div class="card table"><div class="lrow head"><div class="rk">#</div><div>Spieler</div><div class="num">Sp</div><div class="num">Std</div><div class="num">Tore</div><div style="text-align:right">Pkt</div></div>
      ${board.rows.map((r, i) => `<div class="lrow${r.id === S.user.id ? ' me' : ''}">
        <div class="rk">${i + 1}</div>
        <div class="who">${r.fav && CLUBS[r.fav] ? logo(r.fav, CLUBS[r.fav].n, ICONS[r.fav], 24) : `<span class="avatar" style="width:24px;height:24px;font-size:11px">${esc(r.username[0].toUpperCase())}</span>`}<span>${esc(r.username)}</span></div>
        <div class="num">${r.st.games}</div><div class="num">${r.st.stadiums}</div><div class="num">${r.st.goals}</div><div class="pts">${r.points}</div></div>`).join('')}
    </div><div class="hint" style="padding:0 6px">Punkte: 3 pro Spiel, 5 pro Stadion, 1 pro Badge · Sp = Spiele, Std = Stadien</div>`;
    feed = board.feed.length
      ? `<section class="section"><div class="section-head"><h2>Zuletzt im Stadion</h2></div><div class="card feed">${board.feed.map((v) => {
          const k = new Date(v.kickoff);
          const sc = hasScore(v) ? `${v.hg}:${v.ag}` : '–:–';
          return `<div class="feed-item"><span class="avatar">${esc(v.username[0].toUpperCase())}</span><div class="grow">
            <div class="t">${esc(v.username)} · ${esc(v.homeName)} ${sc} ${esc(v.awayName)}</div>
            <div class="s">${esc(v.stadium)} · ${esc(fmtDay.format(k))}</div></div></div>`;
        }).join('')}</div></section>`
      : `<div class="card empty"><h3>Noch keine Spiele</h3><p>Sobald jemand bei einem Spiel „Ich war dabei“ drückt, taucht es hier auf.</p></div>`;
  }

  const leave = S.confirmLeave === l.id
    ? `<div class="two"><button class="secondary press" data-act="leave-yes" data-lid="${l.id}" style="color:var(--live)">Ja, verlassen</button><button class="secondary press" data-act="leave-no">Abbrechen</button></div>`
    : `<button class="link-btn" data-act="leave" data-lid="${l.id}">Liga verlassen</button>`;

  return head + msgHTML(S.ligaMsg) + chips + `<div class="card lg-head">
      <h2>${esc(l.name)}</h2>
      <div class="inline" style="align-items:center"><span class="code" aria-label="Einladungscode">${esc(l.invite_code)}</span>
        <button class="primary press" data-act="invite" data-lid="${l.id}">${ic('people', 18)}Freunde einladen</button></div>
    </div>` + table + feed + leave + forms + logout;
}

function cloudCardHTML() {
  if (S.demo || !cloudConfigured()) return '';
  if (S.user) {
    return `<div class="card cloud"><span style="color:var(--accent)">${ic('check', 26)}</span><div class="grow"><b>Gesichert in deinem Konto</b>
      <span class="muted">Angemeldet als @${esc(S.user.username)}${S.syncError ? ' · Synchronisierung hängt, wird beim nächsten Start nachgeholt' : ''}</span></div></div>`;
  }
  return `<div class="card cloud"><span class="muted">${ic('lock', 24)}</span><div class="grow"><b>Nur auf diesem Gerät</b>
    <span class="muted">Mit Konto ist dein Heft gesichert und du kannst dich mit Freunden messen.</span></div>
    <button class="btn-ghost press" data-act="tab" data-view="liga">Konto</button></div>`;
}

/* ================= Rendern & Navigation ================= */
const VIEWS = { verein: viewVerein, spiele: viewSpiele, stadien: viewStadien, liga: viewLiga, heft: viewHeft };
function viewFromHash() {
  const h = location.hash.slice(1);
  if (h === 'tabelle') { S.spieleMode = 'tabelle'; return 'spiele'; }
  return VIEWS[h] ? h : 'verein';
}

function render() {
  const view = $('#view');
  if (S.lmap) { S.lmap.remove(); S.lmap = null; }
  const kept = {};
  view.querySelectorAll('input[id]').forEach((el) => { kept[el.id] = el.value; });
  const focusId = document.activeElement?.id;
  view.innerHTML = VIEWS[S.view]();
  Object.entries(kept).forEach(([id, val]) => { const el = document.getElementById(id); if (el) el.value = val; });
  if (focusId && kept[focusId] !== undefined) document.getElementById(focusId)?.focus();
  if ($('#lmap')) mountMap();
  document.querySelectorAll('.tab').forEach((t) => {
    const on = t.dataset.view === S.view;
    t.classList.toggle('on', on);
    if (on) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
  });
  const chips = $('#chips');
  if (chips) {
    chips.style.scrollBehavior = 'auto';
    chips.scrollLeft = S.chipScroll;
    const on = chips.querySelector('.chip.on');
    if (on) {
      const target = on.offsetLeft - chips.clientWidth / 2 + on.clientWidth / 2;
      requestAnimationFrame(() => { chips.style.scrollBehavior = ''; chips.scrollLeft = target; S.chipScroll = target; });
    }
  }
}

window.addEventListener('hashchange', () => {
  S.view = viewFromHash(); S.nearError = null; S.ligaMsg = null; render(); window.scrollTo(0, 0);
  if (S.view === 'liga' && S.user && S.league) loadBoard(S.league).then(() => { if (S.view === 'liga') render(); });
});

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const id = Number(el.dataset.id);
  const v = store.visits[id];
  switch (el.dataset.act) {
    case 'tab': if (location.hash !== `#${el.dataset.view}`) location.hash = el.dataset.view; else window.scrollTo({ top: 0, behavior: 'smooth' }); break;
    case 'md': setMatchday(Number(el.dataset.md)); break;
    case 'md-prev': setMatchday(S.matchday - 1); break;
    case 'md-next': setMatchday(S.matchday + 1); break;
    case 'open': openMatch(id); break;
    case 'open-visit': openMatch(id); break;
    case 'close': closeSheet(); break;
    case 'stadium': S.sheet = { type: 'stadium', id }; renderSheet(); break;
    case 'retry': S.cache = {}; S.tables = {}; S.tableErrors = {}; S.clubCache = {}; start(); break;
    case 'spiele-mode': S.spieleMode = el.dataset.mode; render(); break;
    case 'pick-club': {
      S.clubView = id; S.clubPicking = false;
      if (!store.fav) { store.fav = id; persistFav(); }
      render(); window.scrollTo({ top: 0, behavior: 'smooth' }); break;
    }
    case 'club-change': S.clubPicking = !S.clubPicking; render(); break;
    case 'club-fav': store.fav = id; S.clubView = null; persistFav(); vibrate(); render(); break;
    case 'hist-season': S.histSeason = Number(el.dataset.season); render(); break;
    case 'manual': S.manualMsg = null; S.sheet = { type: 'manual' }; renderSheet(); break;
    case 'tick': {
      const m = Object.values(S.clubCache).flatMap((x) => x.list).find((x) => x.matchID === id);
      if (!m) break;
      if (v) deleteVisit(id);
      else { store.visits[id] = visitFromMatch(m, matchState(m) !== 'upcoming'); persistVisit(store.visits[id]); vibrate(); }
      render(); break;
    }
    case 'attend': {
      const m = S.sheet.match;
      const cur = store.visits[m.matchID];
      if (cur) { cur.attended = true; updateVisit(cur, m); } else store.visits[m.matchID] = visitFromMatch(m, true);
      persistVisit(store.visits[m.matchID]); vibrate(); renderSheet(); render(); break;
    }
    case 'plan': { const m = S.sheet.match; store.visits[m.matchID] = visitFromMatch(m, false); persistVisit(store.visits[m.matchID]); vibrate(); renderSheet(); render(); break; }
    case 'remove': deleteVisit(S.sheet.match.matchID); renderSheet(); render(); break;
    case 'confirm-yes': if (v) { v.attended = true; persistVisit(v); vibrate(); render(); } break;
    case 'confirm-no': deleteVisit(id); render(); break;
    case 'logout': if (sb) sb.auth.signOut().finally(() => { if (S.user) afterLogout(); }); break;
    case 'league': S.league = el.dataset.lid; S.ligaMsg = null; S.confirmLeave = null; render(); if (!S.board[S.league]) loadBoard(S.league).then(render); break;
    case 'invite': { const l = (S.leagues || []).find((x) => x.id === el.dataset.lid); if (l) shareInvite(l); break; }
    case 'leave': S.confirmLeave = el.dataset.lid; render(); break;
    case 'leave-no': S.confirmLeave = null; render(); break;
    case 'leave-yes': leaveLeague(el.dataset.lid); break;
    case 'near': findNearby(); break;
    case 'map-style': setMapStyle(el.dataset.style); break;
  }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'fav') { store.fav = Number(e.target.value); S.clubView = null; persistFav(); render(); }
  if (e.target.id === 'bseason') setSeason(Number(e.target.value));
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'note') { const v = store.visits[Number(e.target.dataset.id)]; if (v) { v.note = e.target.value; persistNoteSoon(v); } }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.sheet) closeSheet(); });
document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'auth-form') {
    const mode = e.submitter?.dataset.mode || 'login';
    authSubmit(mode, $('#au').value, $('#ap').value);
  } else if (f.id === 'create-form') {
    S.ligaMsg = null; createLeague($('#lname').value).then(() => { const i = $('#lname'); if (i) i.value = ''; });
  } else if (f.id === 'manual-form') {
    saveManual();
  } else if (f.id === 'join-form') {
    S.ligaMsg = null; joinLeague($('#lcode').value).then(() => { const i = $('#lcode'); if (i) i.value = ''; });
  }
});

function vibrate() { try { navigator.vibrate?.(15); } catch (e) { /* nicht unterstützt */ } }

function findNearby() {
  if (S.nearby) { S.nearby = null; S.mapView = null; render(); return; }
  S.nearError = null;
  if (!navigator.geolocation) { S.nearError = 'Dein Browser gibt keinen Standort frei.'; render(); return; }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      S.nearby = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      S.mapView = { center: [S.nearby.lon, S.nearby.lat], zoom: 8 };
      render();
    },
    () => { S.nearError = 'Standort nicht verfügbar. Erlaube den Standortzugriff in den Browser-Einstellungen. In der Vorschau geht das nicht.'; render(); },
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 }
  );
}

/* Tab-Icons einsetzen */
document.querySelectorAll('[data-icon]').forEach((el) => { el.outerHTML = ic(el.dataset.icon, 24, 1.9); });

/* Offline-Fähigkeit, wenn gehostet */
try {
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
} catch (e) { /* nicht verfügbar */ }

/* Einladungslink ?join=CODE */
try {
  const code = new URLSearchParams(location.search).get('join') || sessionStorage.getItem('stadionheft.join');
  if (code && /^[A-Za-z0-9]{6,12}$/.test(code)) {
    S.pendingJoin = code.toUpperCase();
    sessionStorage.setItem('stadionheft.join', S.pendingJoin);
    history.replaceState(null, '', `${location.pathname}#liga`);
  }
} catch (e) { /* egal */ }

S.view = viewFromHash();
start();
</script>
</body>
</html>
